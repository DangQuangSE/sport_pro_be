name: Deploy Backend to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Create app directory on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p ~/app"

      - name: Transfer JAR to VM
        run: |
          scp target/*.jar ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/app/app.jar

      - name: Deploy on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
            set -e

            # Install Docker if not present
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER
            fi

            # Write Dockerfile
            cat > ~/app/Dockerfile << 'EOF'
FROM eclipse-temurin:21-jre-alpine
WORKDIR /app
COPY app.jar app.jar
EXPOSE 8080
ENTRYPOINT ["java", "-Xmx600m", "-Djava.security.egd=file:/dev/./urandom", "-jar", "app.jar"]
EOF

            # Build Docker image
            cd ~/app
            sudo docker build -t sport-pro-be .

            # Stop and remove old container
            sudo docker stop sport-pro-be 2>/dev/null || true
            sudo docker rm sport-pro-be 2>/dev/null || true

            # Run new container (port 80 ngoài → 8080 trong container)
            sudo docker run -d \
              --name sport-pro-be \
              --restart unless-stopped \
              -p 80:8080 \
              --env-file ~/app/.env \
              sport-pro-be

            echo "Deploy thành công!"
          ENDSSH
