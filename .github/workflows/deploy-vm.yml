name: Deploy Backend to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer files to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "mkdir -p ~/app"
          scp target/*.jar ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/app/app.jar
          scp Dockerfile.runtime ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/app/Dockerfile

      - name: Deploy on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e

            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker $USER
            fi

            cd ~/app
            sudo docker build -t sport-pro-be .
            sudo docker stop sport-pro-be 2>/dev/null || true
            sudo docker rm sport-pro-be 2>/dev/null || true
            sudo docker run -d \
              --name sport-pro-be \
              --restart unless-stopped \
              -p 80:8080 \
              --env-file ~/app/.env \
              sport-pro-be

            echo "Deploy thanh cong!"
          '
