# ===================================================================
# AZURE PRODUCTION RUNTIME PROFILE (application-prod.properties)
# ===================================================================

# Database Connection (Azure Database for PostgreSQL Flexible Server)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Cache Configurations
spring.cache.type=caffeine
spring.cache.cache-names=categories,brands,colors,products

# Server Configurations
server.port=${PORT:8080}
server.forward-headers-strategy=native

# CORS Allowed Origins
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
