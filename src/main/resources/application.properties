spring.application.name=sport_pro_be
server.port=${PORT:8080}
spring.config.import=optional:classpath:config/auth.properties,optional:classpath:config/database.properties,optional:classpath:config/common.properties

spring.cache.type=none
spring.main.lazy-initialization=true

app.notifications.discord.enabled=${DISCORD_NOTIFICATIONS_ENABLED}
app.notifications.discord.bot-token=${DISCORD_BOT_TOKEN}
app.notifications.discord.order-channel-id=${DISCORD_ORDER_CHANNEL_ID}
app.notifications.discord.alert-channel-id=${DISCORD_ALERT_CHANNEL_ID}
app.notifications.discord.admin-order-url-template=${DISCORD_ADMIN_ORDER_URL_TEMPLATE}
app.notifications.discord.currency=${DISCORD_ORDER_CURRENCY}
app.notifications.discord.connect-timeout=${DISCORD_CONNECT_TIMEOUT}
app.notifications.discord.read-timeout=${DISCORD_READ_TIMEOUT}
app.notifications.discord.lease-duration=${DISCORD_LEASE_DURATION}
app.notifications.discord.max-jobs-per-tick=${DISCORD_MAX_JOBS_PER_TICK}
app.notifications.discord.time-zone=${DISCORD_TIME_ZONE}
app.notifications.discord.worker-delay=${DISCORD_WORKER_DELAY}
app.notifications.discord.sent-retention=${DISCORD_SENT_RETENTION}
app.notifications.discord.failed-retention=${DISCORD_FAILED_RETENTION}
app.notifications.discord.cleanup-batch-size=${DISCORD_CLEANUP_BATCH_SIZE}
app.notifications.discord.cleanup-delay=${DISCORD_CLEANUP_DELAY}


