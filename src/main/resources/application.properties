spring.application.name=sport_pro_be
spring.config.import=optional:classpath:config/auth.properties,optional:classpath:config/database.properties,optional:classpath:config/common.properties

spring.cache.type=none
spring.main.lazy-initialization=true

app.notifications.discord.enabled=${DISCORD_NOTIFICATIONS_ENABLED:false}
app.notifications.discord.bot-token=${DISCORD_BOT_TOKEN:}
app.notifications.discord.order-channel-id=${DISCORD_ORDER_CHANNEL_ID:}
app.notifications.discord.alert-channel-id=${DISCORD_ALERT_CHANNEL_ID:}
app.notifications.discord.admin-order-url-template=${DISCORD_ADMIN_ORDER_URL_TEMPLATE:}
app.notifications.discord.currency=${DISCORD_ORDER_CURRENCY:VND}
app.notifications.discord.connect-timeout=${DISCORD_CONNECT_TIMEOUT:5s}
app.notifications.discord.read-timeout=${DISCORD_READ_TIMEOUT:10s}
app.notifications.discord.lease-duration=${DISCORD_LEASE_DURATION:2m}
app.notifications.discord.max-jobs-per-tick=${DISCORD_MAX_JOBS_PER_TICK:10}
app.notifications.discord.time-zone=${DISCORD_TIME_ZONE:Asia/Bangkok}


